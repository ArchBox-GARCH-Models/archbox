[build-system]
requires = ["hatchling>=1.18,<1.22"]
build-backend = "hatchling.build"

[project]
name = "garchbox"
dynamic = ["version"]
description = "ARCH/GARCH volatility models for financial time series"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NodesEcon" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ArchBox-GARCH-Models/archbox"
Documentation = "https://archbox.readthedocs.io"
Repository = "https://github.com/ArchBox-GARCH-Models/archbox"
Issues = "https://github.com/ArchBox-GARCH-Models/archbox/issues"
Changelog = "https://github.com/ArchBox-GARCH-Models/archbox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
numba = [
    "numba>=0.58",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16.4",
    "pyright>=1.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.7",
    "mike>=2.0",
]

[project.scripts]
archbox = "archbox.cli.main:main"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".github/",
    ".hypothesis/",
    ".venv/",
    "dev/",
    "docs/",
    "examples/",
    "logs/",
    "mutants/",
    "site/",
    "tests/",
    "*.bak",
]

[tool.hatch.build.targets.wheel]
packages = ["archbox"]

[tool.hatch.version]
path = "archbox/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Wall-clock benchmarks are excluded by default; run them explicitly with
#   pytest tests/benchmarks -m benchmark
addopts = "-v --tb=short -m 'not benchmark'"
markers = [
    "benchmark: wall-clock performance benchmark (deselected by default; run with -m benchmark)",
]

[tool.coverage.run]
source = ["archbox"]
omit = [
    "archbox/datasets/generate_datasets.py",
    "archbox/cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["N806", "N802"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]
# Example/tutorial scripts: re-exports in __init__, long lines for readability,
# imports after sys.path setup, and math-convention argument names are expected.
"examples/**/__init__.py" = ["F401"]
"examples/**" = ["E402", "E501", "N803"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportConstantRedefinition = false
reportPossiblyUnboundVariable = false
reportPrivateUsage = false
reportPrivateImportUsage = false
reportUntypedFunctionDecorator = false
reportMissingTypeArgument = false
reportMissingImports = false
reportUnnecessaryIsInstance = false
reportUnusedVariable = false

[tool.mutmut]
paths_to_mutate = "archbox/core/"
tests_dir = "tests/"
runner = "python -m pytest tests/core/ tests/estimation/ -x --tb=no -q"
