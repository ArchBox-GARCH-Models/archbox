repos:
  # Keep this pin in step with the `ruff` version in [project.optional-dependencies].dev:
  # a hook older than the ruff on PATH formats the tree one way and the CLI check
  # (`ruff format --check archbox tests`) demands another, and the two rewrite each
  # other on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright archbox/
        language: system
        types: [python]
        pass_filenames: false
