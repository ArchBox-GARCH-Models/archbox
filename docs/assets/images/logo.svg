<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#512da8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" />

  <!-- GARCH volatility envelope (upper) -->
  <polyline
    points="25,90 45,75 60,85 75,55 90,70 105,45 120,65 135,50 150,60 170,55 180,65"
    fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round" />

  <!-- GARCH volatility envelope (lower) -->
  <polyline
    points="25,110 45,125 60,115 75,145 90,130 105,155 120,135 135,150 150,140 170,145 180,135"
    fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main volatility zigzag line -->
  <polyline
    points="25,100 40,88 55,108 65,78 80,115 90,72 105,120 115,80 130,110 140,85 155,105 165,90 180,100"
    fill="none" stroke="#ffffff" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round" />

  <!-- "A" letterform hint -->
  <text x="100" y="175" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700"
    fill="rgba(255,255,255,0.9)" letter-spacing="4">
    ARCH
  </text>
</svg>
